; ESP32-C6 fishing GPS logger
; Board: Waveshare ESP32-C6-LCD-1.47. Waveshare's schematic shows an ESP32-C6FH4 (4 MB);
; Jason's unit reports an ESP32-C6FH8 (8 MB). The 4 MB layout below runs on both.
;
; The official PlatformIO espressif32 platform stops at Arduino core 2.x, which
; has no ESP32-C6 support. The community pioarduino platform ships Arduino
; core 3.x and is pinned here to an exact release.

[platformio]
default_envs = waveshare_c6_lcd147

[env:waveshare_c6_lcd147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
; DevKitM-1 is the generic ESP32-C6 board with 4 MB flash.
board = esp32-c6-devkitm-1

; 3 MB app, no OTA. The firmware is about 1.07 MB, which leaves little room in
; the default 1.25 MB OTA slots, and nothing here uses OTA.
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    lvgl/lvgl@8.3.11
    ress997/TinyGPSPlusPlus@0.0.4
    h2zero/NimBLE-Arduino@2.5.2

build_flags =
    ; The board's USB-C goes straight to the C6's USB-Serial-JTAG, so Serial must be USB CDC.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL finds include/lv_conf.h through the include path.
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

; Warnings for our own code only, not the libraries.
build_src_flags =
    -Wall
    ; LVGL 8's headers mix enum types, which C++20 warns about in every file that includes them.
    -Wno-deprecated-enum-enum-conversion
